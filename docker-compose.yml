services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fleet_safety
    ports:
      - '5432:5432'
    volumes:
      - fleet_safety_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d fleet_safety']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fleet_safety_postgres:
